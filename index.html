<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Neutraliza tentativas de conexão do WebSocket do Vite HMR (HMR desativado no ambiente AI Studio)
      (function() {
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            function ViteHmrStub(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || protocols === 'vite-hmr'))
              ) {
                var listeners = {};
                return {
                  binaryType: 'blob',
                  readyState: 1, // WebSocket.OPEN
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  url: url,
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(event, handler) {
                    listeners[event] = listeners[event] || [];
                    listeners[event].push(handler);
                  },
                  removeEventListener: function(event, handler) {
                    if (!listeners[event]) return;
                    listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                  },
                  dispatchEvent: function() { return true; }
                };
              }
              return new NativeWebSocket(url, protocols);
            }
            ViteHmrStub.prototype = NativeWebSocket.prototype;
            ViteHmrStub.CONNECTING = NativeWebSocket.CONNECTING;
            ViteHmrStub.OPEN = NativeWebSocket.OPEN;
            ViteHmrStub.CLOSING = NativeWebSocket.CLOSING;
            ViteHmrStub.CLOSED = NativeWebSocket.CLOSED;
            window.WebSocket = ViteHmrStub;
          }
        } catch (e) {}
      })();

      // Compatibilidade para extensões de navegador que tentam sobrescrever window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch ? originalFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }

          // Proteção universal para LocalStorage contra QuotaExceededError e restrições de iframe
          (function() {
            try {
              var memStore = {};
              if (typeof window !== 'undefined' && window.localStorage) {
                var origSet = window.localStorage.setItem.bind(window.localStorage);
                var origGet = window.localStorage.getItem.bind(window.localStorage);
                var origRemove = window.localStorage.removeItem.bind(window.localStorage);

                window.localStorage.setItem = function(k, v) {
                  memStore[k] = String(v);
                  try {
                    origSet(k, v);
                  } catch (err) {
                    try {
                      var rRaw = origGet('driftpark_rentals_v1');
                      if (rRaw) {
                        var parsed = JSON.parse(rRaw);
                        if (Array.isArray(parsed) && parsed.length > 20) {
                          origSet('driftpark_rentals_v1', JSON.stringify(parsed.slice(0, 20)));
                        }
                      }
                      origSet(k, v);
                    } catch (e2) {}
                  }
                };

                window.localStorage.getItem = function(k) {
                  try {
                    var v = origGet(k);
                    if (v !== null) return v;
                  } catch (e) {}
                  return memStore[k] !== undefined ? memStore[k] : null;
                };

                window.localStorage.removeItem = function(k) {
                  delete memStore[k];
                  try { origRemove(k); } catch (e) {}
                };
              }
            } catch (storageErr) {}
          })();

          // Captura e silencia erros causados por scripts de extensões do Chrome e limite de cota de Storage
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
               (typeof msg === 'string' && (
                 msg.indexOf('fetch') !== -1 ||
                 msg.indexOf('getter') !== -1 ||
                 msg.indexOf('apenas um getter') !== -1 ||
                 msg.indexOf('setItem') !== -1 ||
                 msg.indexOf('quota') !== -1 ||
                 msg.indexOf('QuotaExceeded') !== -1 ||
                 msg.indexOf('Setting the val') !== -1
               )))
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
    <title>Drift Park - Gestão de Aluguel e Pista</title>
    <meta name="description" content="Sistema moderno e fluido para gestão e aluguel de carrinhos de bate-bate, drift e jeep com arquitetura multi-tenant e telemetria de pista." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DriftPark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Drift Park - Gestão de Aluguel e Pista" />
    <meta property="og:description" content="Sistema moderno e fluido para gestão e aluguel de carrinhos de bate-bate, drift e jeep com arquitetura multi-tenant e telemetria de pista." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // Suprime avisos normais de WebSocket e avisos de RTDB não provisionado
      (function() {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            text += ' ' + String(arguments[i]);
          }
          if (
            text.includes('[vite]') ||
            text.includes('websocket') ||
            text.includes('WebSocket') ||
            text.includes('permission_denied') ||
            text.includes('FIREBASE WARNING') ||
            text.includes('@firebase/database') ||
            text.includes('resource-exhausted') ||
            text.includes('Quota limit exceeded') ||
            text.includes('quota metric') ||
            text.includes('Quota exceeded') ||
            text.includes('Free daily write units') ||
            text.includes('Free daily read units') ||
            text.includes('@firebase/firestore')
          ) return;
          return origWarn.apply(console, arguments);
        };
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            text += ' ' + String(arguments[i]);
          }
          if (
            text.includes('[vite]') ||
            text.includes('websocket') ||
            text.includes('WebSocket') ||
            text.includes('closed without opened') ||
            text.includes('permission_denied') ||
            text.includes('FIREBASE WARNING') ||
            text.includes('@firebase/database') ||
            text.includes('resource-exhausted') ||
            text.includes('Quota limit exceeded') ||
            text.includes('quota metric') ||
            text.includes('Quota exceeded') ||
            text.includes('Free daily write units') ||
            text.includes('Free daily read units') ||
            text.includes('@firebase/firestore')
          ) return;
          return origError.apply(console, arguments);
        };
      })();

      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]'))) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && (event.reason ? (event.reason.message || event.reason) : '')) || '';
        var str = String(reason);
        if (
          str.includes('WebSocket') ||
          str.includes('closed without opened') ||
          str.includes('[vite]') ||
          str.includes('resource-exhausted') ||
          str.includes('Quota limit exceeded') ||
          str.includes('quota metric') ||
          str.includes('Quota exceeded')
        ) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>

    <div id="root"></div>
