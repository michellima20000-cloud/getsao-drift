<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Compatibilidade para extensões de navegador que tentam sobrescrever window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch ? originalFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }

          // Captura e silencia erros causados por scripts de extensões do Chrome
          window.addEventListener('error', function(event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
               (event.message && (
                 event.message.indexOf('fetch') !== -1 ||
                 event.message.indexOf('getter') !== -1 ||
                 event.message.indexOf('apenas um getter') !== -1
               )))
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
    <title>Drift Park - Gestão de Aluguel e Pista</title>
    <meta name="description" content="Sistema moderno e fluido para gestão e aluguel de carrinhos de bate-bate, drift e jeep com arquitetura multi-tenant e telemetria de pista." />
