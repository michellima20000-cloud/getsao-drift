<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Compatibilidade para extensões de navegador que tentam sobrescrever window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch ? originalFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }

          // Captura e silencia erros causados por scripts de extensões do Chrome
          window.addEventListener('error', function(event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
               (event.message && (
                 event.message.indexOf('fetch') !== -1 ||
                 event.message.indexOf('getter') !== -1 ||
                 event.message.indexOf('apenas um getter') !== -1
               )))
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
    <title>Drift Park - Gestão de Aluguel e Pista</title>
    <meta name="description" content="Sistema moderno e fluido para gestão e aluguel de carrinhos de bate-bate, drift e jeep com arquitetura multi-tenant e telemetria de pista." />

    <meta property="og:description" content="Sistema moderno e fluido para gestão e aluguel de carrinhos de bate-bate, drift e jeep com arquitetura multi-tenant e telemetria de pista." />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      // Suprime avisos normais de WebSocket do Vite HMR quando desativado pelo ambiente
      (function() {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('[vite]') || first.includes('websocket') || first.includes('WebSocket'))) return;
          return origWarn.apply(console, arguments);
        };
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('[vite]') || first.includes('websocket') || first.includes('WebSocket') || first.includes('closed without opened'))) return;
          return origError.apply(console, arguments);
        };

        // Intercepta instâncias de WebSocket destinadas ao Vite HMR
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var PatchedWebSocket = function(url, protocols) {
            var ws;
            try {
              ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            } catch (e) {
              ws = {};
            }
            if (typeof url === 'string' && (url.includes('ais-dev') || url.includes('@vite') || url.includes(':3000') || protocols === 'vite-hmr')) {
              var origAddEventListener = ws.addEventListener;
              if (origAddEventListener) {
                ws.addEventListener = function(type, listener, options) {
                  if (type === 'error' || type === 'close') {
                    var safeListener = function(ev) {
                      try {
                        if (ev && ev.stopImmediatePropagation) ev.stopImmediatePropagation();
                        if (ev && ev.preventDefault) ev.preventDefault();
                      } catch (err) {}
                      try {
                        if (listener) listener.call(this, ev);
                      } catch (err) {}
                    };
                    return origAddEventListener.call(this, type, safeListener, options);
                  }
                  return origAddEventListener.apply(this, arguments);
                };
              }
            }
            return ws;
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();

      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('[vite]'))) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && event.reason) || '';
        if (String(reason).includes('WebSocket') || String(reason).includes('closed without opened')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
    </script>
